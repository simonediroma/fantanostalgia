<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FantaNostalgia — Recupera password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/design-system.css">
  <link rel="stylesheet" href="/coach/css/coach.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card ds-panel ds-panel--default">
    <div class="login-logo">⚽ FantaNostalgia</div>
    <p class="login-sub">Recupera password</p>

    <div id="msgBox"></div>

    <form id="forgotForm">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="email">
      <div style="margin-top:1rem">
        <button type="submit" class="ds-button ds-button--default ds-button--full">Invia link di recupero</button>
      </div>
    </form>

    <div style="margin-top:1rem;text-align:center">
      <a href="/coach/login" style="color:var(--muted);font-size:0.75rem;text-decoration:none">← Torna al login</a>
    </div>
  </div>
</div>

<script>
'use strict';

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function showMsg(text, isErr) {
  const el = document.getElementById('msgBox');
  el.innerHTML = `<div class="ds-message ds-message--${isErr ? 'err' : 'ok'}">${esc(text)}</div>`;
}

document.getElementById('forgotForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  try {
    const res = await fetch('/auth/user/forgot-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email}),
    });
    const data = await res.json().catch(() => ({}));
    showMsg(data.detail || 'Se l\'indirizzo è registrato, riceverai a breve un\'email con le istruzioni per il recupero.', false);
    e.target.reset();
  } catch (err) {
    showMsg('Errore di rete', true);
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
