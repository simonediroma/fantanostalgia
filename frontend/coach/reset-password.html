<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FantaNostalgia — Imposta nuova password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/design-system.css">
  <link rel="stylesheet" href="/coach/css/coach.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card ds-panel ds-panel--default">
    <div class="login-logo">⚽ FantaNostalgia</div>
    <p class="login-sub">Imposta una nuova password</p>

    <div id="msgBox"></div>

    <form id="resetForm">
      <label>Nuova password</label>
      <input type="password" id="newPass" required autocomplete="new-password">
      <label>Conferma password</label>
      <input type="password" id="confirmPass" required autocomplete="new-password">
      <div style="margin-top:1rem">
        <button type="submit" class="ds-button ds-button--default ds-button--full">Imposta password</button>
      </div>
    </form>

    <div style="margin-top:1rem;text-align:center">
      <a href="/coach/login" style="color:var(--muted);font-size:0.75rem;text-decoration:none">← Torna al login</a>
    </div>
  </div>
</div>

<script>
'use strict';

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function showMsg(text, isErr) {
  const el = document.getElementById('msgBox');
  el.innerHTML = `<div class="ds-message ds-message--${isErr ? 'err' : 'ok'}">${esc(text)}</div>`;
}

const token = new URLSearchParams(location.search).get('token');
if (!token) {
  showMsg('Link non valido: token mancante. Richiedine uno nuovo dalla pagina di recupero.', true);
  document.getElementById('resetForm').style.display = 'none';
}

document.getElementById('resetForm').addEventListener('submit', async e => {
  e.preventDefault();
  const newPass = document.getElementById('newPass').value;
  const confirmPass = document.getElementById('confirmPass').value;
  if (newPass !== confirmPass) {
    showMsg('Le password non coincidono', true);
    return;
  }
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  try {
    const res = await fetch('/auth/user/reset-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token, new_password: newPass}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.detail || `Errore ${res.status}`);
    }
    showMsg('Password aggiornata. Reindirizzamento al login...', false);
    setTimeout(() => { window.location.href = '/coach/login'; }, 1500);
  } catch (err) {
    showMsg(err.message || 'Errore di rete', true);
    btn.disabled = false;
  }
});
</script>
</body>
</html>
